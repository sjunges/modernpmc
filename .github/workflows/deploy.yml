name: Jupyter Book (via myst) GitHub Pages Deploy

on:
  push:
    branches: [main]
  pull_request:


env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -yy
          sudo apt-get install -y --no-install-recommends \
              graphviz \
              texlive \
              texlive-xetex \
              latexmk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Build the HTML version of the book (this executes code cells)
      - name: Build HTML
        run: jupyter-book build --execute --html

      - name: Build PDF
        run: jupyter-book build --execute --pdf

      - name: Copy PDF to site
        run: |
          cp lecture-notes.pdf _build/html/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

      - name: Deploy to GitHub Pages
        # Only login if using main on original repo (and not for pull requests or forks)
        if: github.repository_owner == 'sjunges' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
