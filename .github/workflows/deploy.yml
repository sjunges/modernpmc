name: Jupyter Book (via myst) GitHub Pages Deploy

on:
  push:
    branches: [main]

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-jupyter-book

      - name: Install Jupyter Book (MyST)
        run: npm install -g jupyter-book

      - name: Build HTML
        run: jupyter-book build --execute --html

      - name: Disable Jekyll
        run: touch _build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _build/html
          branch: gh-pages
          clean-exclude: pr-preview/