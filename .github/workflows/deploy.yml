name: Jupyter Book (via myst) GitHub Pages Deploy

on:
  push:
    branches: [main]
  pull_request:


env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz \
            texlive \
            texlive-xetex \
            latexmk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-jupyter-book

      - name: Install Jupyter Book (MyST)
        run: npm install -g jupyter-book

      # Build the HTML version of the book (this executes code cells)
      - name: Build HTML
        run: jupyter-book build --execute --html

      - name: Build PDF
        run: jupyter-book build --execute --pdf
        continue-on-error: true

      - name: Disable Jekyll
        run: touch _build/html/.nojekyll

      - name: Copy PDF to site
        run: |
          cp lecture-notes.pdf _build/html/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

      - name: Deploy to GitHub Pages
        # Only login if using main on original repo (and not for pull requests or forks)
        if: github.repository_owner == 'sjunges' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
