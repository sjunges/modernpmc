name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  BASE_URL: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Save PR metadata
        run: |
          mkdir -p pr-meta
          echo "${{ github.event.number }}" > pr-meta/pr-number.txt
          echo "${{ github.event.action }}" > pr-meta/action.txt

      - name: Setup Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        if: github.event.action != 'closed'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz \
            texlive \
            texlive-xetex \
            latexmk \
            imagemagick \
            librsvg2-bin

      - name: Install Python dependencies
        if: github.event.action != 'closed'
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache npm
        if: github.event.action != 'closed'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-jupyter-book

      - name: Install Jupyter Book (MyST)
        if: github.event.action != 'closed'
        run: npm install -g jupyter-book

      - name: Build HTML
        if: github.event.action != 'closed'
        run: jupyter-book build --execute --html 2>&1 | tee build.log

      - name: Build PDF
        id: pdf
        if: github.event.action != 'closed'
        run: jupyter-book build --execute --pdf 2>&1 | tee pdf-build.log
        continue-on-error: true

      - name: Collect artifact
        if: github.event.action != 'closed'
        run: |
          touch _build/html/.nojekyll
          cp -r _build/html pr-meta/html

          if [ "${{ steps.pdf.outcome }}" == "success" ]; then
            pdf_src=$(find _build -name "*.pdf" 2>/dev/null | head -1)
            if [ -n "$pdf_src" ]; then
              cp "$pdf_src" pr-meta/html/lecture-notes.pdf
            fi
          fi

          warnings=$(grep '⚠️' build.log | sed 's/^[[:space:]]*//' || true)
          preview_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/"
          {
            echo "### Preview"
            echo "🔍 [$preview_url]($preview_url)"
            echo ""
            if [ -n "$warnings" ]; then
              echo "### MyST build warnings"
              echo '```'
              echo "$warnings"
              echo '```'
            else
              echo "✅ No build warnings."
            fi
            echo ""
            if [ "${{ steps.pdf.outcome }}" == "success" ] && [ -f pr-meta/html/lecture-notes.pdf ]; then
              echo "✅ PDF build succeeded. [lecture-notes.pdf](${preview_url}lecture-notes.pdf)"
            elif [ "${{ steps.pdf.outcome }}" == "success" ]; then
              echo "⚠️ PDF build reported success but no PDF file was found."
            else
              echo "❌ PDF build failed."
            fi
            pdf_errors=$(grep -E '(⛔️|fatal:|LaTeX Error:)' pdf-build.log | sed 's/^[[:space:]]*//' || true)
            if [ -n "$pdf_errors" ]; then
              echo ""
              echo "#### PDF errors"
              echo '```'
              echo "$pdf_errors"
              echo '```'
            fi
          } > pr-meta/comment.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview
          path: pr-meta/
          include-hidden-files: true
          retention-days: 1