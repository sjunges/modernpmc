name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  BASE_URL: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies
        if: github.event.action != 'closed'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        if: github.event.action != 'closed'
        run: |
          uv pip install --system jupyter ipykernel
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

      - name: Cache npm
        if: github.event.action != 'closed'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-jupyter-book

      - name: Install Jupyter Book (MyST)
        if: github.event.action != 'closed'
        run: npm install -g jupyter-book

      - name: Build HTML
        if: github.event.action != 'closed'
        run: jupyter-book build --execute --html 2>&1 | tee build.log

      - name: Prepare warnings comment
        if: github.event.action != 'closed'
        run: |
          warnings=$(grep '⚠️' build.log | sed 's/^[[:space:]]*//' || true)
          if [ -n "$warnings" ]; then
            printf '### MyST build warnings\n```\n%s\n```\n' "$warnings" > warnings.md
          else
            echo '✅ No build warnings.' > warnings.md
          fi

      - name: Post warnings to PR
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: myst-build-warnings
          number: ${{ github.event.number }}
          path: warnings.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable Jekyll
        if: github.event.action != 'closed'
        run: |
          touch _build/html/.nojekyll
          mkdir -p /tmp/nojekyll && touch /tmp/nojekyll/.nojekyll

      - name: Ensure .nojekyll at gh-pages root
        if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: /tmp/nojekyll
          clean: false

      - name: Deploy or tear down PR preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _build/html
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto