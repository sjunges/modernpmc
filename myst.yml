# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: b671e404-2fdb-42a5-83fd-2326c008e311
  plugins:
    - feedback-links.mjs
  title: Model Checking Lecture Notes
  # description:
  # keywords: []
  authors: [Sebastian Junges]
  exports:
    - format: pdf
      template: plain_latex
      output: lecture-notes.pdf
  # github:
  # To autogenerate a Table of Contents, run "jupyter book init --write-toc"
  toc:
    - file: preface.md
    - file: mdps.md
    - file: multiobjective.md
    - file: parametric.md
    - file: pomdps.md
    - file: appendix.md
  license:
    content:
      id: CC-BY-NC-SA-4.0
  github:  sjunges/modernpmc
  math:
    '\lfp': '\mathsf{lfp.}'
    '\gfp': '\mathsf{gfp.}'
    '\mdp': 'M'
    '\mdptuple': '\langle S, A, \delta \rangle'
    '\Distr': '\mathsf{Distr}\left(#1\right)'
    '\sinit': 's_{\textrm{init}}'
    '\supp': '\mathsf{supp}\left(#1\right)'
    '\EnAct': 'A_{\mathsf{en}}\left(#1\right)'
    '\ap': '\mathsf{AP}'
    '\Policies': '\Pi'
    '\MdPolicies': '\Pi_{md}'
    '\MrPolicies': '\Pi_{mr}'
    '\Paths': '\mathsf{Paths}'
    '\last': '\mathsf{last}(#1)'
    '\pr': '\mathsf{Pr}'
    '\Spos': 'S^{max}_{>0}'
    '\Sposmin' : 'S^{min}_{>0}'
    '\Smaxzero': 'S^{max}_{=0}'
    '\Szero': 'S^{min}_{=0}'
    '\Smaxas': 'S^{max}_{=1}'
    '\Sminas': 'S^{min}_{=1}'
    '\Szerogp': 'S^{gp}_{=0}'
    '\infinite': '\mathsf{inf}(#1)'
    '\drew': '\mathsf{disc}'
    '\AP': '\mathsf{AP}'
    '\ApTrace': '\mathsf{Tr}'
    '\aptrace': '\mathsf{tr}(#1)'
    '\opt': '\mathrm{opt}'
    '\Intervals': '\mathbb{I}'
    '\dfa': '\mathcal{A}'
    '\Acc': '\mathsf{Acc}'
    '\indicator': '[{#1}]'
    '\ratfunc': '\mathbb{Q}(#1)'
    '\poly': '\mathbb{Q}[#1]'
    '\val': '\mathsf{val}'
    '\pmdp': '\mathcal{M}'
    '\imdp': '\mathcal{M}'
    '\solfunc': '\mathsf{sol}'
    '\generator': '\llbracket #1 \mid #2 \rrbracket'
    '\generatorwd': '\llbracket #1 \rrbracket_\mathsf{wd}'
    '\generatorint': '\llbracket #1 \rrbracket'
    '\generatormd' : '\llbracket #1 \rrbracket_\mathsf{MD}'
    '\generatormr': '\llbracket #1 \rrbracket_\mathsf{MR}'
    '\bigland': '\bigwedge'
    '\Ach': '\mathsf{Ach}'
    '\abst': '\mathsf{lift}(#1,#2)'
    '\Obs': 'Z'
    '\obsfun': '\mathsf{obs}'
    '\obstr': '\obsfun(#1)'
    '\binit': 'b_\mathrm{init}'
site:
  template: book-theme
  options:
  #   favicon: favicon.ico
  #   logo: site_logo.png
    logo_text: Lecture Notes
    style: public/feedback.css

